<main class="main">
  <div class="coldiv">
    <form class="form" [formGroup]="bibleForm" (submit)="submitForm($event)">
      <div class="field">
        <label for="verse">Verse</label>
        <input class="input" id="verse" type="text" formControlName="verse" />
      </div>

      <div class="field">
        <label for="version">Version</label>
        <input class="input" id="version" type="text" formControlName="version" />
      </div>

      <div class="field">
        <label for="content">Content</label>
        <textarea class="input" id="content" formControlName="content"></textarea>
      </div>
      <button type="submit">Submit</button>
    </form>
  </div>
  <div class="coldiv">
    <p>This is where we see our data</p>
  </div>
</main>

<router-outlet />
