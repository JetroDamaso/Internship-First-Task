name: Deploy Action

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - uses: actions/checkout@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Message
        run: |
          echo "=========================================="
          echo "success on Deploy Action"
          echo "=========================================="
