name: Test Action

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - uses: actions/checkout@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Message
        run: |
          echo "=========================================="
          echo "success on Test Action"
          echo "=========================================="
